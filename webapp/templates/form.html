<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body onload="checkResult()">
    <script>
        function checkResult() {
            if ("{{ finished }}" == "True") {
                document.getElementById("result").style.display = "block";
            }
        }
    </script>
    <div id="form">
        <form onsubmit="TEST()" method="POST">
            <label>Table Geometry</label>
            <input type="radio" name="geometry" value="rectangle" checked="checked">Rectangle
            <input type="radio" name="geometry" value="elliptical">Elliptical
            <input type="radio" name="geometry" value="stadium">Bunimovich Stadium
            <br />
            <label>Table Dimensions</label>
            <input type="number" step="any" name="width" placeholder="Width" required>
            <input type="number" step="any" name="height" placeholder="Height" required>
            <br />
            <label>Starting Position</label>
            <input type="number" step="any" name="start_x" placeholder="X-Position" required>
            <input type="number" step="any" name="start_y" placeholder="Y-Position" required>
            <br />
            <label>Initial Angle (Degrees)</label>
            <input type="number" step="any" name="angle" placeholder="90">
            <br />
            <input id="submit" type="submit" style="margin-top: 1vh;" value="Get Trajectories">
        </form>
    </div>

    <div id="loader"></div>
    
    <div id="result" style="display:none">
        <img id="scatter_gif" src="static/scatter.gif" />
    </div>

    <script>
        function TEST() {
            document.getElementById("result").style.display = "none";
            document.getElementById("loader").style.display = "block";
        }
    </script>
</body>

<style>
    body {
        font-family: "Inter Tight", serif;
        padding: 20px;
        color: #4b5563
    }
    label {
        display: block;
        font-weight: bold;
        margin-top: 1vh;
        margin-bottom: 1vh;
        font-size: 1.25em;
    }
    form {
        width: 50%;
        margin: auto;
        text-align: center;
        accent-color: #4ade80;
    }

    form #submit {
        background-color: white;
        border-color: #4b5563;
        font-family: "Inter Tight", serif;
        font-size: 1.25em;
        padding: 15px;
        box-shadow: -10px 5px 0px rgba(75, 85, 99, 1);
        transition: 0.1s;

        &:hover {
            box-shadow: -15px 8px 0px #4ade80;
            cursor: pointer;
            color: #4ade80;
            border-color: #4ade80;
        }

    } 

    #result img {
        display: inherit;
        margin: auto;
    }

    #loader {
      border: 16px solid #d1d5db;
      border-radius: 50%;
      border-top: 16px solid #4ade80;
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite; /* Safari */
      animation: spin 2s linear infinite;
      margin: auto;
      margin-top: 5vh;
      display: none;
    }
    
    /* Safari */
    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
</style>

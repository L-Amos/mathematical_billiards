<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body onload="checkResult()">
    <script>
        function checkResult() {
            if ("{{ finished }}" == "True") {
                document.getElementById("result").style.display = "block";
            } else if ("{{ finished }}" == "Error") {
                document.getElementById("error").style.display = "block";
                document.getElementById("error").innerText = "{{ error_msg }}"
            };
        }
    </script>
    <div id="form_stuff">
        <form onsubmit="getTrajectories()" method="POST">
            <label>Table Geometry</label>
            <input onclick="dimHint('static/rectangle_dims.svg')" type="radio" class="geometry" name="geometry" value="rectangle" checked="checked"><p>Rectangle</p>
            <input onclick="dimHint('static/ellipse_dims.svg')" type="radio" class="geometry" name="geometry" value="elliptical"><p>Ellipse</p>
            <input onclick="dimHint('static/stadium_dims.svg')" type="radio" class="geometry" name="geometry" value="stadium"><p>Bunimovich Stadium</p>
            <br />
            <img id="dim_hint" src="static/rectangle_dims.svg" />
            <label>Table Dimensions</label>
            <input type="number" step="any" name="width" placeholder="Width" required>
            <input type="number" step="any" name="height" placeholder="Height" required>
            <br />
            <label>Starting Position<br /><p>Origin is Centre Point</p></label><br />
            <input type="number" step="any" name="start_x" placeholder="X-Position" required>
            <input type="number" step="any" name="start_y" placeholder="Y-Position" required>
            <br />
            <label>Initial Angle (Degrees)</label>
            <input type="number" step="any" name="angle" placeholder="90">
            <br />
            <input id="submit" type="submit" value="Get Trajectories">
        </form>
    </div>
    
    <div id="error"></div>

    <div id="loader"></div>
    
    <div id="result" style="display:none">
        <img id="scatter_gif" src="static/scatter.gif" />
    </div>

    <script>
        function getTrajectories() {
            document.getElementById("error").style.display = "none";
            document.getElementById("result").style.display = "none";
            document.getElementById("loader").style.display = "block";
        }
        function dimHint(path) {
            document.getElementById("dim_hint").src = path
        }
    </script>
</body>

<style>
    body {
        font-family: "Inter Tight", serif;
        padding: 20px;
        color: #4b5563;
    }

    #form_stuff {
        width:80%;
        margin: auto;
    }

    #dim_hint {
        width: 80%;
        aspect-ratio: 3;
        margin: auto;
    }


    form {
        width: 100%;
        text-align: center;
        accent-color: #4ade80;
        
    }
    
    form label {
        display: block;
        font-weight: bold;
        margin-top: 1rem;
        margin-bottom: 1rem;
        font-size: 2rem;
    }

    form input,p {
        font-size: 1.25rem;
        display: inline;
        color: #4b5563;
    }

    form input {
        margin-bottom: 2.5rem;
    }

    form .geometry:hover {
        cursor: pointer;
    }

    form #submit {
        background-color: white;
        border-color: #4b5563;
        color: #4b5563;
        font-family: "Inter Tight", serif;
        font-size: 1.5rem;
        padding: 15px;
        box-shadow: -10px 5px 0px rgba(75, 85, 99, 1);
        transition: 0.1s;
        margin-top: 1rem;
        margin-bottom: 1rem;

        &:hover {
            box-shadow: -15px 8px 0px #4ade80;
            cursor: pointer;
            color: #4ade80;
            border-color: #4ade80;
        }

    } 

    #error {
        background-color: #f38383;
        margin:auto;
        width: 50%;
        text-align: center;
        padding: 5px;
        display: none;
        margin-top: 1rem;
    }

    #loader {
      border: 16px solid #d1d5db;
      border-radius: 50%;
      border-top: 16px solid #4ade80;
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite; /* Safari */
      animation: spin 2s linear infinite;
      margin: auto;
      margin-top: 5rem;
      display: none;
    }

    #result img {
        display: inherit;
        margin: auto;
    }
    
    /* Safari */
    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
</style>
